x-app-environment: &app-environment
    APP_NAME: "${APP_NAME:-Legumexapps Tickets}"
    APP_ENV: "${APP_ENV:-production}"
    APP_KEY: "${APP_KEY}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_URL: "${APP_URL:-http://localhost:8000}"
    APP_LOCALE: "${APP_LOCALE:-en}"
    LOG_CHANNEL: stack
    LOG_STACK: single
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: "${DB_DATABASE:-legumexapps_tickets_db}"
    DB_USERNAME: "${DB_USERNAME:-legumex}"
    DB_PASSWORD: "${DB_PASSWORD:-mysecretpassword}"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: local
    JWT_SECRET: "${JWT_SECRET}"
    ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
    ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@legumex.com}"
    ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    # Microsoft Graph (correo de tickets). Sin estas, crear/cerrar tickets falla.
    MSGRAPH_TENANT_ID: "${MSGRAPH_TENANT_ID}"
    MSGRAPH_CLIENT_ID: "${MSGRAPH_CLIENT_ID}"
    MSGRAPH_CLIENT_SECRET: "${MSGRAPH_CLIENT_SECRET}"
    MSGRAPH_FROM: "${MSGRAPH_FROM}"
    MSGRAPH_SAVE_TO_SENT: "${MSGRAPH_SAVE_TO_SENT:-true}"

x-app-service: &app-service
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        # Sin esto se construiria el ultimo stage (standalone, con su propio
        # mariadb dentro). Aqui la base es el servicio db.
        target: runtime
    image: legumexapps-tickets-backend:latest
    restart: unless-stopped
    environment: *app-environment
    volumes:
        - app_storage:/var/www/html/storage
    networks:
        - legumexapps
    depends_on:
        db:
            condition: service_healthy

services:
    # PHP-FPM: sirve la aplicación y es el único que corre las migraciones.
    app:
        <<: *app-service
        volumes:
            - app_storage:/var/www/html/storage
            - app_public:/var/www/html/public

    # Nginx: expone public/ y delega los .php a app:9000.
    # Monta tambien storage para resolver public/storage -> storage/app/public
    # (adjuntos de tickets).
    web:
        image: nginx:1.27-alpine
        restart: unless-stopped
        depends_on:
            - app
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - app_public:/var/www/html/public:ro
            - app_storage:/var/www/html/storage:ro
        networks:
            - legumexapps

    # Worker de la cola (QUEUE_CONNECTION=database).
    queue:
        <<: *app-service
        command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
        depends_on:
            db:
                condition: service_healthy
            app:
                condition: service_started

    # Scheduler (reemplaza al cron de php artisan schedule:run).
    scheduler:
        <<: *app-service
        command: ["php", "artisan", "schedule:work"]
        depends_on:
            db:
                condition: service_healthy
            app:
                condition: service_started

    db:
        image: mysql:8.4
        restart: unless-stopped
        command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-legumexapps_tickets_db}"
            # root comparte la contraseña de la app; el usuario de la app lo crea
            # docker/mysql/init-user.sh (la imagen no acepta MYSQL_USER=root).
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-mysecretpassword}"
            DB_USERNAME: "${DB_USERNAME:-legumex}"
            DB_PASSWORD: "${DB_PASSWORD:-mysecretpassword}"
        ports:
            - "${DB_PORT_FORWARD:-3307}:3306"
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql/init-user.sh:/docker-entrypoint-initdb.d/10-init-user.sh:ro
        healthcheck:
            # Durante la inicializacion mysql levanta un servidor temporal solo por
            # socket; el ping por TCP solo responde cuando el definitivo esta listo.
            test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - legumexapps

volumes:
    app_storage:
    app_public:
    db_data:

networks:
    legumexapps:
        driver: bridge
